name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kyruma
          POSTGRES_PASSWORD: kyruma
          POSTGRES_DB: kyruma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kyruma -d kyruma_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://kyruma:kyruma@localhost:5432/kyruma_ci_placeholder
      TEST_DATABASE_URL: postgresql://kyruma:kyruma@localhost:5432/kyruma_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: touch .env.local
      - run: npm run verify:repo-hygiene
      - run: npm run test:config-safety
      - run: npm run test:security
      - run: DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
      - run: npm run test:foundation
      - run: npm run test:lead-lifecycle
      - run: npm run test:lead-persistence
      - run: npm run test:discovery-intelligence
      - run: npm run test:intelligence-persistence
      - run: npm run test:partner-creation
      - run: npm run test:partner-persistence
      - run: npm run test:workspace
      - run: npm run test:workspace-persistence
      - run: npm run test:operations-hub
      - run: npm run test:operations-persistence
      - run: npm run test:event-bus
      - run: npm run test:event-bus-persistence
      - run: npm run test:audit
      - run: npm run test:audit-persistence
      - run: npm run test:access
      - run: npm run test:access-persistence
      - run: npm run test:partner-portal
      - run: npm run test:automations
      - run: npm run test:operating-layer
      - run: npm run test:operating-layer-persistence
      - run: npm run test:operating-intelligence
      - run: npm run test:security-persistence
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
