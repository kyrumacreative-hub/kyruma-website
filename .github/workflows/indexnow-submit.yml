name: Submit IndexNow URLs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/indexnow-submit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify production ownership key
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat public/4890356b0ab5e03b7f833bf387bc0a14511da81d7e4dc0f8.txt)"
          BODY="$(curl --silent --show-error --fail --retry 3 --retry-delay 5 "https://www.kyruma.com/${KEY}.txt")"
          test "$BODY" = "$KEY"

      - name: Submit current commercial and Insights URLs
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(cat public/4890356b0ab5e03b7f833bf387bc0a14511da81d7e4dc0f8.txt)"
          PAYLOAD="$(node - "$KEY" <<'NODE'
          const key = process.argv[2];
          const urlList = [
            "https://www.kyruma.com/",
            "https://www.kyruma.com/granada",
            "https://www.kyruma.com/insights",
            "https://www.kyruma.com/match",
            "https://www.kyruma.com/auditoria-instagram",
            "https://www.kyruma.com/auditoria-instagram/ejemplo",
            "https://www.kyruma.com/insights/auditoria-instagram-que-revisar",
            "https://www.kyruma.com/insights/errores-instagram-negocios",
            "https://www.kyruma.com/insights/como-saber-si-tu-web-esta-perdiendo-clientes",
            "https://www.kyruma.com/insights/auditoria-web-que-revisar",
            "https://www.kyruma.com/insights/branding-para-empresas-cuando-necesitas",
            "https://www.kyruma.com/insights/diseno-web-granada-que-debe-incluir",
            "https://www.kyruma.com/express",
            "https://www.kyruma.com/express/instagram-reset"
          ];
          process.stdout.write(JSON.stringify({ host: "www.kyruma.com", key, urlList }));
          NODE
          )"

          STATUS="$(curl --silent --show-error --output /tmp/indexnow-response.txt --write-out '%{http_code}' \
            --request POST 'https://api.indexnow.org/indexnow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data "$PAYLOAD")"

          cat /tmp/indexnow-response.txt || true
          echo "IndexNow HTTP status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            exit 1
          fi
