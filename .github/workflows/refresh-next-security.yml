name: Refresh secure Next dependencies

on:
  push:
    branches:
      - growth/organic-instagram-cluster-v1

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message == 'chore(security): trigger secure Next dependency refresh' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: growth/organic-instagram-cluster-v1

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Update Next runtime packages
        run: npm install --save-exact next@16.3.8 @next/third-parties@16.3.8

      - name: Update Next lint config
        run: npm install --save-dev --save-exact eslint-config-next@16.3.8

      - name: Apply non-breaking production audit fixes
        run: npm audit fix --omit=dev

      - name: Verify high and critical production vulnerabilities are cleared
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(security): update Next.js and production dependency fixes"
          git push origin HEAD:growth/organic-instagram-cluster-v1
